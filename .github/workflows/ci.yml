name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # Lints package.json, the exports map and the tarball contents.
      - run: npx --yes publint

      # Checks that TypeScript resolves the types for every entry point, as ESM and as CommonJS.
      - run: npx --yes @arethetypeswrong/cli --pack . --exclude-entrypoints ./style.css

      # Real-browser tests: Chromium, Firefox and WebKit. They run once, on the newest Node.
      - name: Install the test browsers
        if: matrix.node == 22
        run: npx playwright install --with-deps chromium firefox webkit

      # The library is also tested on React 17 and React 19, each installed in its own folder.
      - name: Install React 17 and 19 for the compatibility tests
        if: matrix.node == 22
        run: |
          npm ci --prefix tests/react17
          npm ci --prefix tests/react19

      - name: Run the browser tests
        if: matrix.node == 22
        run: npm run test:e2e

      - name: Keep the test report when a test fails
        if: failure() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The React example and the landing page install the library from this folder,
      # so building them checks the real build output.
      - name: Build the React example
        working-directory: examples/react
        run: |
          npm ci
          npm run build

      - name: Build the landing page
        working-directory: site
        run: |
          npm ci
          npm run build
